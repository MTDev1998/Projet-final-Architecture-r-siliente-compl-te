apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {app: gateway, projet: shopflow}
spec:
  replicas: 3
  selector:
    matchLabels: {app: gateway}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: gateway, projet: shopflow}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: {app: gateway}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: gateway
          image: shopflow-gateway:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: SERVICE_NAME
              value: "gateway"
            - name: RESILIENCE
              value: "on"
            - name: ORDERS_URL
              value: "http://orders:8001"
            - name: INVENTORY_URL
              value: "http://inventory:8002"
          resources:
            requests: {cpu: "100m", memory: "96Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
          startupProbe:
            httpGet: {path: /health/startup, port: 8000}
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {app: gateway, projet: shopflow}
spec:
  selector: {app: gateway}
  ports:
    - port: 8000
      targetPort: 8000
  type: NodePort
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: gateway}
