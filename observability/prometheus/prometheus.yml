global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: shopflow
    # Les services répliqués (inventory, payment) sont découverts par DNS : une cible par conteneur.
    dns_sd_configs:
      - names: [gateway, orders, inventory, payment, bank]
        type: A
        port: 8000
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
      - source_labels: [__meta_dns_name, __address__]
        regex: "gateway;(.*):\\d+"
        replacement: "$1:8000"
        target_label: __address__
      - source_labels: [__meta_dns_name, __address__]
        regex: "orders;(.*):\\d+"
        replacement: "$1:8001"
        target_label: __address__
      - source_labels: [__meta_dns_name, __address__]
        regex: "inventory;(.*):\\d+"
        replacement: "$1:8002"
        target_label: __address__
      - source_labels: [__meta_dns_name, __address__]
        regex: "payment;(.*):\\d+"
        replacement: "$1:8003"
        target_label: __address__
      - source_labels: [__meta_dns_name, __address__]
        regex: "bank;(.*):\\d+"
        replacement: "$1:8080"
        target_label: __address__
